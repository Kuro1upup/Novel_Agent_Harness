[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "novel-agent-harness"
version = "0.5.0"
description = "A provider-neutral agent harness for long-form web novel writing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Novel Agent Harness contributors" }]
dependencies = [
  "alembic>=1.13,<2",
  "anyio>=4.4,<4.10",
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<1",
  "minio>=7.2,<8",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pymilvus>=2.4,<3",
  "pymysql>=1.1,<2",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "redis>=5,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
novel-harness = "novel_harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_harness"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: requires local MySQL, MinIO and Milvus services",
  "live: requires an external LLM or search service",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
